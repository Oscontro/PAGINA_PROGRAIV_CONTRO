<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72" role="img" aria-label="Emblema Band of Brothers - Easy Company 506 PIR">
  <!-- Emblema tipo insignia militar: alas de paracaidista + numeral de regimiento.
       Sustituible por el logotipo real manteniendo el mismo nombre de archivo. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c98f"/>
      <stop offset="1" stop-color="#9a8a4f"/>
    </linearGradient>
  </defs>
  <!-- Alas -->
  <path d="M12 40 C40 20 66 22 78 38 C60 34 40 36 30 44 Z" fill="url(#metal)"/>
  <path d="M228 40 C200 20 174 22 162 38 C180 34 200 36 210 44 Z" fill="url(#metal)"/>
  <!-- Paracaídas -->
  <path d="M92 34 A28 28 0 0 1 148 34 Z" fill="none" stroke="#c9a227" stroke-width="3"/>
  <path d="M92 34 L120 52 L148 34" fill="none" stroke="#c9a227" stroke-width="2"/>
  <!-- Numeral -->
  <text x="120" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" letter-spacing="4" fill="#e8e2d0">506</text>
</svg>
