<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Paracaidistas descendiendo sobre Normandia al amanecer">
  <!-- Imagen de fondo del Hero (marcador de posicion).
       Reemplazar por una fotografia real (hero.jpg) con las mismas dimensiones aprox. 16:9. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f14"/>
      <stop offset="0.55" stop-color="#3b421d"/>
      <stop offset="1" stop-color="#0e0f0a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.30" r="0.35">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- Linea de horizonte / terreno -->
  <path d="M0 720 L280 690 L520 715 L820 675 L1120 710 L1600 680 L1600 900 L0 900 Z" fill="#0b0c07"/>
  <path d="M0 780 L400 760 L900 785 L1600 755 L1600 900 L0 900 Z" fill="#000000" opacity="0.6"/>
  <!-- Avion de transporte C-47 (silueta simplificada) -->
  <g fill="#0b0c07" opacity="0.9">
    <path d="M170 150 l120 18 l40 -10 l10 12 l-44 16 l-118 10 l-70 -28 z"/>
    <path d="M150 168 l-60 40 l14 8 l70 -30 z"/>
  </g>
  <!-- Paracaidistas -->
  <g stroke="#0b0c07" stroke-width="3" fill="#0b0c07">
    <g transform="translate(430,260)">
      <path d="M-34 0 A34 22 0 0 1 34 0 Z" fill="none"/>
      <line x1="-30" y1="2" x2="0" y2="46"/><line x1="30" y1="2" x2="0" y2="46"/>
      <circle cx="0" cy="52" r="7"/>
    </g>
    <g transform="translate(690,360) scale(1.25)">
      <path d="M-34 0 A34 22 0 0 1 34 0 Z" fill="none"/>
      <line x1="-30" y1="2" x2="0" y2="46"/><line x1="30" y1="2" x2="0" y2="46"/>
      <circle cx="0" cy="52" r="7"/>
    </g>
    <g transform="translate(980,300) scale(0.9)">
      <path d="M-34 0 A34 22 0 0 1 34 0 Z" fill="none"/>
      <line x1="-30" y1="2" x2="0" y2="46"/><line x1="30" y1="2" x2="0" y2="46"/>
      <circle cx="0" cy="52" r="7"/>
    </g>
    <g transform="translate(1200,420) scale(1.4)">
      <path d="M-34 0 A34 22 0 0 1 34 0 Z" fill="none"/>
      <line x1="-30" y1="2" x2="0" y2="46"/><line x1="30" y1="2" x2="0" y2="46"/>
      <circle cx="0" cy="52" r="7"/>
    </g>
  </g>
</svg>
